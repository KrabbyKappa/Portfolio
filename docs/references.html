  <script>
    const referenceGrid = document.querySelector('.reference-preview-grid');
    const referenceDocuments = referenceGrid
      ? Array.from(referenceGrid.querySelectorAll('[data-reference-document]'))
      : [];
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    referenceDocuments.forEach((documentCard) => {
      const toggle = documentCard.querySelector('[data-reference-toggle]');
      toggle?.addEventListener('click', async () => {
        const wasExpanded = documentCard.dataset.expanded === 'true';
        const firstRects = new Map(referenceDocuments.map((item) => [item, item.getBoundingClientRect()]));

        referenceDocuments.forEach((item) => {
          const isExpanded = item === documentCard && !wasExpanded;
          item.dataset.expanded = String(isExpanded);
          item.querySelector('[data-reference-toggle]')?.setAttribute('aria-expanded', String(isExpanded));
        });
        referenceGrid.dataset.expandedReference = wasExpanded ? '' : documentCard.dataset.referenceDocument;

        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        if (reducedMotion.matches) return;

        referenceDocuments.forEach((item) => {
          const first = firstRects.get(item);
          const last = item.getBoundingClientRect();
          const deltaX = first.left - last.left;
          const deltaY = first.top - last.top;
          const scaleX = first.width / last.width;
          const scaleY = first.height / last.height;

          item.animate(
            [
              { transform: `translate(${deltaX}px, ${deltaY}px) scale(${scaleX}, ${scaleY})` },
              { transform: 'translate(0, 0) scale(1, 1)' },
            ],
            { duration: 680, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' },
          );
        });
      });
    });

  </script>

  <script>
    (() => {
      const clickableCards = Array.from(document.querySelectorAll('[data-showcase-card-href]'));
      clickableCards.forEach((card) => {
        let startX = 0;
        let startY = 0;
        let dragged = false;
        card.addEventListener('pointerdown', (event) => {
          startX = event.clientX;
          startY = event.clientY;
          dragged = false;
        }, { passive: true });
        card.addEventListener('pointermove', (event) => {
          if (Math.hypot(event.clientX - startX, event.clientY - startY) > 8) dragged = true;
        }, { passive: true });
        card.addEventListener('click', (event) => {
          if (event.target.closest('a') || dragged) return;
          window.location.href = card.dataset.showcaseCardHref;
        });
        card.addEventListener('keydown', (event) => {
          if (event.target.closest('a')) return;
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            window.location.href = card.dataset.showcaseCardHref;
          }
        });
      });

      const wheels = Array.from(document.querySelectorAll('[data-trsnparent-mini-wheel]'));
      if (!wheels.length) return;
      const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
      wheels.forEach((wheel) => {
        const wrap = wheel.querySelector('.mini-cylinder-wrap');
        const items = Array.from(wheel.querySelectorAll('.mini-cylinder-item'));
        if (!wrap || !items.length) return;
        const theta = 360 / items.length;
        let currentAngle = 0;
        let frame = 0;
        let isVisible = true;
        let lastPaintTime = performance.now();
        const AUTOSPIN_DEGREES_PER_MS = 360 / (6 * 60 * 1000);

        const updateDepth = () => {
          const width = wrap.offsetWidth || Number.parseFloat(getComputedStyle(wrap).width) || 150;
          const naturalRadius = (width / 2) / Math.tan(Math.PI / items.length);
          const radius = Math.ceil(naturalRadius + 14);
          wheel.style.setProperty('--mini-cylinder-depth', `${radius}px`);
          items.forEach((item, index) => {
            item.style.setProperty('--mini-cylinder-angle', `${index * theta}deg`);
          });
        };

        const normalize = (angle) => ((((angle % 360) + 540) % 360) - 180);
        const paint = (now = performance.now()) => {
          const delta = Math.min(80, Math.max(0, now - lastPaintTime));
          lastPaintTime = now;
          if (!reduceMotion && isVisible) currentAngle -= delta * AUTOSPIN_DEGREES_PER_MS;
          wrap.style.setProperty('--mini-rotate', `${currentAngle}deg`);
          items.forEach((item, index) => {
            const distance = Math.abs(normalize(index * theta + currentAngle));
            const frontness = Math.max(0, Math.cos(distance * Math.PI / 180));
            item.style.opacity = String(0.18 + frontness * 0.82);
            item.style.zIndex = String(Math.round(frontness * 20));
          });
          if (!reduceMotion && isVisible) frame = requestAnimationFrame(paint);
          else frame = 0;
        };
        const requestPaint = () => {
          if (!frame) frame = requestAnimationFrame(paint);
        };
        updateDepth();
        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              isVisible = entry.isIntersecting;
              wheel.classList.toggle('is-mini-visible', isVisible);
              if (isVisible) {
                lastPaintTime = performance.now();
                requestPaint();
              }
            });
          }, { threshold: 0.18 });
          observer.observe(wheel);
        } else {
          wheel.classList.add('is-mini-visible');
        }
        window.addEventListener('resize', () => { updateDepth(); requestPaint(); }, { passive: true });
        paint();
      });
    })();
  </script>
