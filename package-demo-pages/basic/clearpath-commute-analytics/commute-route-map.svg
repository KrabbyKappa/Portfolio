<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">ClearPath commute route map</title>
  <desc id="desc">A dark operations route map with cyan relief route, amber constrained route, green stable route, and red hot node.</desc>
  <rect width="920" height="560" fill="#06111f"/>
  <g opacity=".18" stroke="#4ee8ff" stroke-width="1"><path d="M80 90h760M80 170h760M80 250h760M80 330h760M80 410h760M160 50v460M300 50v460M440 50v460M580 50v460M720 50v460"/></g>
  <path d="M128 378 C260 336 348 350 474 292 S674 232 792 172" fill="none" stroke="#4ee8ff" stroke-width="16" stroke-linecap="round"/>
  <path d="M148 164 C280 202 386 188 504 246 S670 330 800 306" fill="none" stroke="#ffbf4d" stroke-width="16" stroke-linecap="round"/>
  <path d="M126 446 C270 456 372 428 510 410 S696 422 800 438" fill="none" stroke="#76f1b4" stroke-width="16" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" font-size="20" font-weight="700">
    <circle cx="128" cy="378" r="20" fill="#4ee8ff"/><text x="82" y="356" fill="#dffbff">West lot</text>
    <circle cx="792" cy="172" r="20" fill="#4ee8ff"/><text x="708" y="142" fill="#dffbff">River hub</text>
    <circle cx="148" cy="164" r="20" fill="#ffbf4d"/><text x="92" y="124" fill="#ffe4a8">North garage</text>
    <circle cx="800" cy="306" r="24" fill="#ff5b6e"/><text x="708" y="350" fill="#ffd5da">Main gate hot</text>
    <circle cx="126" cy="446" r="18" fill="#76f1b4"/><text x="82" y="492" fill="#ccffe4">East spur</text>
    <circle cx="800" cy="438" r="18" fill="#76f1b4"/><text x="710" y="486" fill="#ccffe4">Clinic stop</text>
  </g>
  <rect x="78" y="38" width="764" height="48" rx="24" fill="#0d1b2d" stroke="#27415e"/>
  <text x="110" y="69" font-family="Arial,sans-serif" font-size="18" fill="#4ee8ff" font-weight="700">cyan relief</text>
  <text x="280" y="69" font-family="Arial,sans-serif" font-size="18" fill="#ffbf4d" font-weight="700">amber constrained</text>
  <text x="510" y="69" font-family="Arial,sans-serif" font-size="18" fill="#76f1b4" font-weight="700">green stable</text>
  <text x="700" y="69" font-family="Arial,sans-serif" font-size="18" fill="#ff5b6e" font-weight="700">red hot node</text>
</svg>
